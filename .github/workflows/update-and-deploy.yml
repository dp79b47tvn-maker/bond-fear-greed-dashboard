name: 每日更新並部署儀表板

on:
  schedule:
    # 每個交易日美股收盤後跑一次(22:00 UTC = 美東18:00 EDT / 17:00 EST)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安裝中文字型(圖表用)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 重新產生儀表板資料
        run: python3 update_dashboard.py

      - name: 產生定義手冊與首頁
        run: python3 generate_manual.py

      - name: 產生因子驗證報告
        run: python3 factor_validation_analysis.py

      - name: 驗證儀表板
        run: python3 scripts/verify_dashboard.py

      - name: 把重新產生的頁面commit回repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/dashboard.html chart/manual.html chart/index.html chart/factor_validation_report.html
          git diff --staged --quiet || (git commit -m "自動更新: $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push)

      - name: 上傳Pages產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: chart

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
