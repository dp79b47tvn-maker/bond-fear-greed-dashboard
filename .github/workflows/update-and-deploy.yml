name: 每日更新並部署儀表板

on:
  schedule:
    # 每個交易日美股收盤後跑一次(22:00 UTC = 美東18:00 EDT / 17:00 EST)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 安裝中文字型與 Python 套件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          pip install -r requirements.txt

      # 純靜態檢查、不發網路請求，放在最前面：抓因子清單/資料管線互相脫鉤的問題。
      # 這類 bug 以前都是上線之後才發現(見 scripts/check_consistency.py 開頭說明)，
      # 現在改成部署前就擋下來，failed 就不會產出壞掉的頁面。
      - name: 一致性檢查
        run: python3 scripts/check_consistency.py

      - name: 重新產生儀表板資料
        run: python3 update_dashboard.py

      - name: 產生首頁
        run: python3 generate_hub.py

      - name: 驗證儀表板
        run: python3 scripts/verify_dashboard.py

      - name: 把重新產生的頁面commit回repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A chart/
          git diff --staged --quiet || (git commit -m "自動更新: $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase origin main && git push)

      - name: 上傳Pages產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: chart

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
