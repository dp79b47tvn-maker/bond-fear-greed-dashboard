name: 產生因子相關係數矩陣 (手動觸發)

on:
  workflow_dispatch:
    inputs:
      factor_keys:
        description: '逗號分隔的因子score_col清單(至少2個)，例: momentum_score,strength_score,promoted_us10y_score'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安裝中文字型 (圖表用)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生相關係數矩陣
        env:
          FACTOR_KEYS: ${{ inputs.factor_keys }}
        run: python3 scripts/generate_correlation_matrix.py --factor-keys "$FACTOR_KEYS"

      - name: Commit 並 Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/correlation_matrix.html
          git diff --staged --quiet || (git commit -m "feat(correlation): 產生因子相關係數矩陣" && git pull --rebase origin main && git push)

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: chart

  deploy:
    needs: correlate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
