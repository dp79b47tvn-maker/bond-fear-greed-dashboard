name: 升等候選因子 (手動觸發)

on:
  workflow_dispatch:
    inputs:
      config_json:
        description: '候選因子完整設定 JSON（key/label/mode/sources/params/invert）'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安裝中文字型 (圖表用)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 寫入升等候選因子暫存清單
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
        run: python3 scripts/promote_factor.py --config-json "$CONFIG_JSON"

      - name: 重新產生儀表板 (納入新升等因子)
        run: python3 update_dashboard.py

      - name: 驗證儀表板
        run: python3 scripts/verify_dashboard.py

      - name: Commit 並 Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promoted_candidate_factors.json chart/
          git diff --staged --quiet || (git commit -m "feat(promote): 升等候選因子為儀表板可選因子" && git pull --rebase origin main && git push)

      - name: 上傳 Pages 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: chart

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
