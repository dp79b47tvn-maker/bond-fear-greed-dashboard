const W = 1140, H = 560;
const M = { left: 46, right: 20, top: 16, bottom: 70 };
const plotW = W - M.left - M.right;
const plotH = H - M.top - M.bottom;

const n = DATA.length;
const xScale = i => M.left + (i / (n - 1)) * plotW;
const yScale = v => M.top + (1 - v / 100) * plotH;

const zones = [
  { lo: 0, hi: 25, color: "var(--critical)", opacity: 0.14 },
  { lo: 25, hi: 45, color: "var(--serious)", opacity: 0.12 },
  { lo: 45, hi: 56, color: "var(--neutral-band)", opacity: 0.6 },
  { lo: 56, hi: 76, color: "var(--good-soft)", opacity: 0.14 },
  { lo: 76, hi: 100, color: "var(--good)", opacity: 0.14 },
];

const svgns = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
  const e = document.createElementNS(svgns, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

const svg = document.getElementById("chart");

// zone background bands
zones.forEach(z => {
  svg.appendChild(el("rect", {
    x: M.left, y: yScale(z.hi), width: plotW, height: yScale(z.lo) - yScale(z.hi),
    fill: z.color, opacity: z.opacity
  }));
});

// horizontal gridlines at 0/25/45/56/76/100
[0, 25, 45, 56, 76, 100].forEach(v => {
  const y = yScale(v);
  svg.appendChild(el("line", { x1: M.left, x2: W - M.right, y1: y, y2: y, class: "grid-line" }));
  const t = el("text", { x: M.left - 8, y: y + 3, class: "axis-label", "text-anchor": "end" });
  t.textContent = v;
  svg.appendChild(t);
});

// x-axis year ticks
const yearTicks = [];
DATA.forEach((d, i) => {
  const year = d.date.slice(0, 4);
  const md = d.date.slice(5, 10);
  if (md === "01-01" || i === 0) yearTicks.push({ i, year: d.date.slice(0,4) });
});
yearTicks.forEach(({ i, year }) => {
  const x = xScale(i);
  svg.appendChild(el("line", { x1: x, x2: x, y1: M.top, y2: H - M.bottom, class: "grid-line" }));
  const t = el("text", { x: x, y: H - M.bottom + 16, class: "axis-label", "text-anchor": "middle" });
  t.textContent = year;
  svg.appendChild(t);
});

// composite score line
let d = "";
DATA.forEach((pt, i) => {
  const x = xScale(i), y = yScale(pt.score);
  d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
});
svg.appendChild(el("path", { d, class: "series-line" }));

// ---- Annotations ----
function addVLine(i, color) {
  const x = xScale(i);
  const line = el("line", { x1: x, x2: x, y1: M.top, y2: H - M.bottom, class: "annotation-line" });
  if (color) line.setAttribute("stroke", color);
  svg.appendChild(line);
  return x;
}

function addMarker(i, color) {
  const x = xScale(i), y = yScale(DATA[i].score);
  svg.appendChild(el("circle", { cx: x, cy: y, r: 4.5, class: "marker-dot", stroke: color }));
  return { x, y };
}

function addLabel(x, y, lines, anchor) {
  anchor = anchor || "middle";
  lines.forEach((line, k) => {
    const t = el("text", { x, y: y + k * 13, class: k === 0 ? "annotation-text" : "annotation-sub", "text-anchor": anchor });
    t.textContent = line;
    svg.appendChild(t);
  });
}

const svbStart = 1162, svbEnd = 1174, svbLowIdx = 1155;
svg.appendChild(el("rect", {
  x: xScale(svbStart), y: M.top, width: xScale(svbEnd) - xScale(svbStart), height: plotH,
  fill: "var(--critical)", opacity: 0.08
}));
addVLine(1164, "var(--critical)"); // 2023-03-10 SVB collapse
{
  const m = addMarker(svbLowIdx, "var(--critical)");
  addLabel(m.x, M.top + 14, ["矽谷銀行危機", "2023-03-10 倒閉", "最低 24.0（恐懼，貼近極度恐懼）"], "start");

}
{
  const m = addMarker(2127, "var(--good)");
  addLabel(m.x, m.y - 14, ["2025-10-28 高點 62.5（貪婪）"], "middle");

// ---- Hover crosshair + tooltip ----
const tooltip = document.getElementById("tooltip");
const overlay = el("rect", { x: M.left, y: M.top, width: plotW, height: plotH, fill: "transparent" });
svg.appendChild(overlay);

const crosshair = el("line", { class: "crosshair-line", y1: M.top, y2: H - M.bottom, x1: 0, x2: 0, style: "opacity:0" });
svg.appendChild(crosshair);
const hoverDot = el("circle", { r: 4, fill: "var(--series-1)", style: "opacity:0" });
svg.appendChild(hoverDot);

function scoreToLabel(s) {
  if (s < 25) return "極度恐懼";
  if (s < 45) return "恐懼";
  if (s < 56) return "中性";
  if (s < 76) return "貪婪";
  return "極度貪婪";
}

overlay.addEventListener("mousemove", (e) => {
  const rect = svg.getBoundingClientRect();
  const scaleX = W / rect.width;
  const mx = (e.clientX - rect.left) * scaleX;
  const idx = Math.max(0, Math.min(n - 1, Math.round(((mx - M.left) / plotW) * (n - 1))));
  const pt = DATA[idx];
  const x = xScale(idx), y = yScale(pt.score);
  crosshair.setAttribute("x1", x); crosshair.setAttribute("x2", x);
  crosshair.style.opacity = 1;
  hoverDot.setAttribute("cx", x); hoverDot.setAttribute("cy", y);
  hoverDot.style.opacity = 1;

  const svgRect = svg.getBoundingClientRect();
  const px = svgRect.left + (x / W) * svgRect.width;
  const py = svgRect.top + (y / H) * svgRect.height;
  tooltip.style.left = (px - svg.parentElement.getBoundingClientRect().left + 12) + "px";
  tooltip.style.top = (py - svg.parentElement.getBoundingClientRect().top - 40) + "px";
  tooltip.innerHTML = `<div class="t-date">${pt.date}</div><div class="t-score">${pt.score.toFixed(1)} 分 · ${pt.label}</div>`;
  tooltip.style.opacity = 1;
});
overlay.addEventListener("mouseleave", () => {
  crosshair.style.opacity = 0;
  hoverDot.style.opacity = 0;
  tooltip.style.opacity = 0;
});
